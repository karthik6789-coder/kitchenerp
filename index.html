<style>
  :root{
    --ink:#1f2937; --ink-soft:#4b5563; --ink-faint:#9ca3af;
    --bg:#f7f7f5; --card:#ffffff; --border:#e5e7eb; --border-strong:#d1d5db;
    --accent:#1d4ed8; --accent-soft:#eff6ff;
    --teal:#0d9488; --teal-soft:#f0fdfa;
    --red:#b91c1c; --red-soft:#fef2f2;
    --green:#166534; --green-soft:#f0fdf4;
    --purple:#6d28d9; --purple-soft:#f5f3ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  .app{max-width:1500px;margin:0 auto;padding:16px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}

  .topbar .sub{font-size:12px;color:var(--ink-faint);}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:4px;}
  .tab{padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-soft);}
  .tab.active{background:var(--accent);color:#fff;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 10px;font-weight:700;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{
    border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);

  button.danger{color:var(--red);border-color:#fca5a5;}

  .neg{background:var(--red-soft)!important;color:var(--red);font-weight:700;}

<script>
// ============================================================

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAhf1hwo1nchkb37lFV_Mr84eJW56Vu65Y",
  authDomain: "srichaitanya-kitchen-erp-2026.firebaseapp.com",
  projectId: "srichaitanya-kitchen-erp-2026",
  storageBucket: "srichaitanya-kitchen-erp-2026.firebasestorage.app",
  messagingSenderId: "188436806571",
  appId: "1:188436806571:web:f398930663b0fb4567f0ee"
};

const USE_LOCAL_MOCK = (FIREBASE_CONFIG.apiKey === "YOUR_API_KEY");

// ============================================================
// DATA LAYER — thin wrapper so the rest of the app never talks to
// Firestore directly. In real deployment this calls Firebase; for local
// testing (before you've pasted your config) it uses an in-memory mock
// with the same shape, so the exact same app code works both ways.
// ============================================================
let auth, dbFS;
let currentUser = null;   // {uid, email}
let currentRole = null;   // {role, kitchenIds, name}

const mock = { auth:null, collections:{} };
function mockCollection(name){ if (!mock.collections[name]) mock.collections[name] = {}; return mock.collections[name]; }

async function dbGet(collection, docId){
  if (USE_LOCAL_MOCK){ const c = mockCollection(collection); return c[docId] ? JSON.parse(JSON.stringify(c[docId])) : null; }
  const snap = await dbFS.collection(collection).doc(docId).get();
  return snap.exists ? snap.data() : null;
}
async function dbSet(collection, docId, data){
  if (USE_LOCAL_MOCK){ const c = mockCollection(collection); c[docId] = JSON.parse(JSON.stringify(data)); return; }
  await dbFS.collection(collection).doc(docId).set(data, {merge:true});
}
async function dbDelete(collection, docId){
  if (USE_LOCAL_MOCK){ const c = mockCollection(collection); delete c[docId]; return; }
  await dbFS.collection(collection).doc(docId).delete();
}
async function dbGetAll(collection){
  if (USE_LOCAL_MOCK){
    const c = mockCollection(collection);
    return Object.keys(c).map(id => Object.assign({id}, JSON.parse(JSON.stringify(c[id]))));
  }
  const snap = await dbFS.collection(collection).get();
  const out = [];
  snap.forEach(doc => out.push(Object.assign({id: doc.id}, doc.data())));
  return out;
}
function newId(){ return 'id_' + Math.random().toString(36).slice(2,11); }

// ---------- auth ----------
async function doLogin(email, password){
  if (USE_LOCAL_MOCK){
    // local mock: any email/password works, role comes from a seeded 'users' doc keyed by email
    const users = mockCollection('users');
    let found = Object.keys(users).find(uid => users[uid].email === email);
    if (!found){
      // first login for this email in the mock → make it an admin so local testing/dev is unblocked
      found = newId();
      users[found] = { email, role: 'admin', kitchenIds: [], name: email.split('@')[0] };
    }
    currentUser = { uid: found, email };
    currentRole = users[found];
    return { ok: true };
  }
  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    currentUser = { uid: cred.user.uid, email: cred.user.email };
    const roleDoc = await dbGet('users', cred.user.uid);
    if (!roleDoc){ return { ok:false, error: 'Your account has no role assigned yet. Ask your admin to add you in the Users sheet.' }; }
    currentRole = roleDoc;
    return { ok: true };
  } catch(e){
    return { ok:false, error: humanizeAuthError(e) };
  }
}
function humanizeAuthError(e){
  const c = e && e.code || '';
  if (c.includes('user-not-found') || c.includes('wrong-password') || c.includes('invalid-credential')) return 'Wrong email or password.';
  if (c.includes('too-many-requests')) return 'Too many attempts. Try again in a bit.';
  return 'Could not log in. ' + (e && e.message || '');
}
// Admin creates another person's login from right here — no trip to Firebase Console needed.
// Uses a SECOND, separate Firebase app instance to create the account, so the new sign-in
// doesn't hijack the admin's own session (this is the standard workaround for "admin creates
// other users" purely client-side, since createUserWithEmailAndPassword normally signs YOU
// into the new account on whatever instance you call it from).
async function createUserAccount(){
  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;
  const kitchenId = document.getElementById('newUserKitchen').value;
  const status = document.getElementById('createUserStatus');
  status.textContent = '';
  if (!email || !password){ status.textContent = 'Enter an email and a temporary password.'; return; }
  if (password.length < 6){ status.textContent = 'Password needs to be at least 6 characters (Firebase requirement).'; return; }

  if (USE_LOCAL_MOCK){
    const id = newId();
    const userData = { email, role, kitchenIds: role==='dataentry' ? [kitchenId] : [], name: email.split('@')[0] };
    await dbSet('users', id, userData);
    status.innerHTML = `✓ Created (local mock) — ${email} as ${role}.`;
    document.getElementById('newUserEmail').value=''; document.getElementById('newUserPassword').value='';
    setTimeout(renderMaster, 2500);
    return;
  }

  status.textContent = 'Creating…';
  let secondaryApp;
  try{
    secondaryApp = firebase.initializeApp(FIREBASE_CONFIG, 'UserCreation_' + Date.now());
    const secondaryAuth = secondaryApp.auth();
    const cred = await secondaryAuth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    await secondaryAuth.signOut();
    const userData = { email, role, kitchenIds: role==='dataentry' ? [kitchenId] : [], name: email.split('@')[0] };
    await dbSet('users', uid, userData);
    status.innerHTML = `✓ Created — tell them to sign in with <b>${escapeAttr(email)}</b> and the temporary password you set. They should change it after their first login (there's no in-app "change password" yet — for now, create a new login with a fresh password and remove the old one if it needs resetting).`;
    document.getElementById('newUserEmail').value=''; document.getElementById('newUserPassword').value='';
    setTimeout(renderMaster, 3500);
  } catch(e){
    const c = e && e.code || '';
    if (c.includes('email-already-in-use')) status.textContent = 'That email already has a login — find them in the table below and edit their role there instead.';
    else if (c.includes('weak-password')) status.textContent = 'Password too weak — use at least 6 characters.';
    else if (c.includes('invalid-email')) status.textContent = 'That email address looks invalid.';
    else status.textContent = 'Could not create the login: ' + (e && e.message || e);
  } finally {
    if (secondaryApp) await secondaryApp.delete().catch(()=>{});
  }
}

function doLogout(){
  if (!USE_LOCAL_MOCK && auth) auth.signOut();
  currentUser = null; currentRole = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
}

function toast(msg){
  const t = document.getElementById('statusToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1600);
}
function round(n, d=2){ const f=Math.pow(10,d); return Math.round((+n||0)*f)/f; }
function fmt(n, d=2){ return round(n,d).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
// A day with no activity for some metric shows as 0 — averaging that 0 in with real days
// drags the average down and misrepresents it (e.g. 35,0,45,55 should average to 45, the
// three days that actually had activity, not 33.75 across all four including the empty one).
function avgExcludingZero(values){
  const nonZero = values.filter(v => v !== 0 && v != null && !isNaN(v));
  if (!nonZero.length) return 0;
  return nonZero.reduce((a,b)=>a+b,0) / nonZero.length;
}
function fmtMoney(n){ return '₹'+Math.round(+n||0).toLocaleString('en-IN'); }
function isoDate(d){ return d.toISOString().slice(0,10); }
function addDays(iso, n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoDate(d); }
function ddmmyyyy(iso){ const [y,m,d]=iso.split('-'); return `${d}-${m}-${y}`; }
function escapeAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }

// Every field auto-saves by re-rendering the whole entry screen (so totals/costs/available-
// balance everywhere stay correct) — but a naive re-render destroys and rebuilds every input,
// which throws away keyboard focus mid-Tab and mid-Enter. Reading document.activeElement
// AFTER an await turned out to be unreliable — by the time an async change-handler resumes,
// blur has already fired and focus can sit on <body> for a moment, so timing races made the
// old approach miss the field entirely. Instead, a lightweight 'focusin' listener keeps a
// running record of whichever field most recently had focus — reliable regardless of when
// the re-render actually happens.
let _lastFocusedKey = null, _lastFocusedSelStart = null, _lastFocusedSelEnd = null;
document.addEventListener('focusin', (e)=>{
  const key = e.target && e.target.dataset && e.target.dataset.focusKey;
  if (key){
    _lastFocusedKey = key;
    _lastFocusedSelStart = typeof e.target.selectionStart === 'number' ? e.target.selectionStart : null;
    _lastFocusedSelEnd = typeof e.target.selectionEnd === 'number' ? e.target.selectionEnd : null;
  }
  // Select the existing value whenever a number field gains focus — otherwise Tab lands the
  // cursor at position 0 of a default "0", so typing inserts beside it ("5" into "0" becomes
  // "50" instead of replacing it). Selecting first makes typing simply overwrite, like a
  // spreadsheet cell — this is what was producing corrupted values like 200/50/20/10 instead
  // of 20/5/2/1 when tabbing straight through a row.
  if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'number'){
    e.target.select();
  }
});
async function renderEntryPreservingFocus(){
  // A short delay here matters: pressing Tab blurs the current field (firing this handler)
  // and moves focus to the next field as two parts of the SAME browser action — if the
  // re-render runs immediately, it can finish before the browser gets to the "move focus
  // to the next field" part, so we'd end up re-focusing the field the user just left
  // instead of the one Tab was headed to. Waiting one tick lets that native focus-move
  // complete first, so the 'focusin' tracker above has already caught up to it.
  await new Promise(r => setTimeout(r, 30));
  const focusKey = _lastFocusedKey;
  await renderEntry();
  if (focusKey){
    const el = document.querySelector(`[data-focus-key="${CSS.escape(focusKey)}"]`);
    if (el) el.focus(); // triggers the 'focusin' listener above, which also selects its content
  }
}
function fk(...parts){ return parts.join('::'); }

// Reusable searchable provision picker — replaces a plain <select> (unusable once you have
// 500+ provisions) with type-to-filter, shown as "ID | Name | UOM | Category" per your format.
// Returns {getSelectedId, reset}. inputEl and listEl must already be in the DOM.
function attachProvisionPicker(inputEl, listEl, optionsProvider){
  let selectedId = null;
  const fmt = pm => `${pm.provisionId||'—'} | ${pm.name} | ${pm.uom} | ${pm.category}`;
  function renderList(filter){
    const opts = optionsProvider();
    const f = (filter||'').trim().toUpperCase();
    const matches = !f ? opts.slice(0,30) : opts.filter(pm => fmt(pm).toUpperCase().includes(f)).slice(0,30);
    listEl.innerHTML = matches.length ? matches.map(pm=>
      `<div class="pickerRow" data-id="${pm.id}"><span class="pid">${escapeAttr(pm.provisionId||'')}</span> — ${escapeAttr(pm.name)} <span class="pid">(${escapeAttr(pm.uom)}, ${escapeAttr(pm.category)})</span></div>`
    ).join('') : '<div class="note" style="padding:8px;">No matches</div>';
    listEl.style.display = 'block';
    listEl.querySelectorAll('[data-id]').forEach(row=>{
      row.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        selectedId = row.dataset.id;
        const pm = optionsProvider().find(o=>o.id===selectedId);
        inputEl.value = fmt(pm);
        listEl.style.display = 'none';
      });
    });
  }
  inputEl.addEventListener('input', ()=>{ selectedId = null; renderList(inputEl.value); });
  inputEl.addEventListener('focus', ()=> renderList(inputEl.value));
  inputEl.addEventListener('blur', ()=> setTimeout(()=>{ listEl.style.display='none'; }, 150));
  return {
    getSelectedId: ()=> selectedId,
    reset: ()=>{ selectedId=null; inputEl.value=''; },
  };
}


async function initFirebase(){
  if (USE_LOCAL_MOCK){
    console.warn('Running in LOCAL MOCK mode — paste your Firebase config to go live.');
    document.getElementById('loginScreen').style.display = 'block';
    return;
  }
  const app = firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  dbFS = firebase.firestore();
  // keep the session alive across page refreshes/tab closes — this is what was missing:
  // Firebase silently restores the underlying token on load, but without this listener
  // the app never learns about it and always fell back to showing the login screen.
  await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  auth.onAuthStateChanged(async (user)=>{
    if (user){
      currentUser = { uid: user.uid, email: user.email };
      const roleDoc = await dbGet('users', user.uid);
      if (!roleDoc){
        document.getElementById('loginError').textContent = 'Your account has no role assigned yet. Ask your admin to add you under Users & roles.';
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        return;
      }
      currentRole = roleDoc;
      await enterApp();
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
    }
  });
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email || !pw){ errEl.textContent = 'Enter email and password.'; return; }
  const res = await doLogin(email, pw);
  if (!res.ok){ errEl.textContent = res.error; return; }
  // For real Firebase, onAuthStateChanged (wired in initFirebase) fires right after a
  // successful sign-in and takes it from here — same single code path used to restore a
  // session on refresh, so login and refresh-restore can never drift apart. The local mock
  // has no such listener, so it still needs this explicit call.
  if (USE_LOCAL_MOCK) await enterApp();
});
document.getElementById('logoutLink').addEventListener('click', (e)=>{ e.preventDefault(); doLogout(); });

async function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('userEmail').textContent = currentUser.email;
  document.getElementById('userRole').textContent = currentRole.role;
  await boot();
}

// ============================================================
// APP STATE
// ============================================================
const SESSIONS = ['BREAKFAST','LUNCH','SNACKS','DINNER'];
const AC_TYPES = ['AC','SEMI-AC','NON-AC'];
let kitchens = [], branches = [], provisions = [], menuItems = [], recipes = {};
let currentKitchenId = null;
let currentDate = isoDate(new Date());
let reportFromDate = null, reportToDate = null; // persisted separately so re-rendering the dashboard never resets a date range you already picked
let dayCache = {};

function myKitchenIds(){
  if (currentRole.role === 'admin' || currentRole.role === 'director') return kitchens.map(k=>k.id);
  return currentRole.kitchenIds || [];
}

async function boot(){
  [kitchens, branches, provisions, menuItems] = await Promise.all([
    dbGetAll('kitchens'), dbGetAll('branches'), dbGetAll('provisions'), dbGetAll('menuItems')
  ]);
  const recipeList = await dbGetAll('recipes');
  recipes = {}; recipeList.forEach(r => recipes[r.id] = r);

  if (!kitchens.length && currentRole.role === 'admin') await seedDemoData();

  const myKitchens = myKitchenIds();
  currentKitchenId = myKitchens[0] || null;

  renderTabs();
  await switchTab(currentRole.role === 'director' ? 'dashboard' : 'entry');
}

// Strip the directional-override marks (\u202d etc.) that show up in some copy-pasted
// provision names from the source system, and normalize whitespace/case.
function cleanImportedText(v){
  return String(v==null?'':v).replace(/[\u200e\u200f\u202a-\u202e]/g, '').trim();
}

async function importMasterDataFromExcel(){
  const fileInput = document.getElementById('masterImportFile');
  const status = document.getElementById('importStatus');
  if (!fileInput.files.length){ status.textContent = 'Choose a file first.'; return; }
  status.textContent = 'Reading file…';
  const buf = await fileInput.files[0].arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheetRows = (name) => {
    if (!wb.SheetNames.includes(name)) return null;
    return XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:null});
  };

  let counts = {kitchens:0, provisions:0, branches:0, openingBalances:0, targets:0};
  const sectionErrors = []; // one section failing (e.g. a permissions issue) must not stop the rest
  const kitchenCodeToId = {}; kitchens.forEach(k=>{ if (k.kitchenCode) kitchenCodeToId[k.kitchenCode]=k.id; });
  const provisionCodeToId = {}; provisions.forEach(p=>{ if (p.provisionId) provisionCodeToId[p.provisionId]=p.id; });
  let multiBakeryKitchens = [];

  // 1) Kitchens — must go first, everything else references KITCHEN_ID. A KITCHEN_ID can
  // legitimately repeat if the kitchen is served by more than one bakery (confirmed in your
  // file: KVJA106208 has both "VJA BAKERY 1" and "VJA BAKERY 3" on separate rows) — so bakery
  // names are ACCUMULATED into a list per kitchen, never overwritten.
  try{
    const kRows = sheetRows('Kitchen_List');
    if (kRows){
      status.textContent = `Importing ${kRows.length} kitchens…`;
      for (const row of kRows){
        const code = cleanImportedText(row['KITCHEN_ID']);
        if (!code) continue;
        const bakery = cleanImportedText(row['BAKERY_NAME']);
        let id = kitchenCodeToId[code];
        if (!id){
          id = newId();
          const data = {
            stateCode: cleanImportedText(row['STATE']),
            division: cleanImportedText(row['DIVISION']),
            kitchenCode: code,
            name: cleanImportedText(row['KITCHEN_NAME']),
            bulkStoreName: cleanImportedText(row['BULK_STORE_NAME']),
            bakeryNames: bakery ? [bakery] : [],
          };
          kitchens.push(Object.assign({id}, data));
          kitchenCodeToId[code] = id;
          await dbSet('kitchens', id, data);
        } else {
          const existing = kitchens.find(k=>k.id===id);
          if (bakery && !existing.bakeryNames.includes(bakery)){
            existing.bakeryNames.push(bakery);
            multiBakeryKitchens.push(existing.name);
            await dbSet('kitchens', id, existing);
          }
        }
        counts.kitchens++;
      }
    }
  } catch(e){ sectionErrors.push('Kitchens: ' + (e.message||e)); }

  // 2) Provisions
  try{
    const pRows = sheetRows('Provision_List');
    if (pRows){
      status.textContent = `Importing ${pRows.length} provisions…`;
      for (const row of pRows){
        const code = cleanImportedText(row['PROVISION ID']);
        if (!code) continue;
        let id = provisionCodeToId[code];
        const existing = id ? provisions.find(p=>p.id===id) : null;
        const data = {
          provisionType: cleanImportedText(row['PROVISION TYPE']),
          provisionId: code,
          name: cleanImportedText(row['PROVISION NAME']),
          uom: cleanImportedText(row['UOM']),
          category: cleanImportedText(row['CATEGORY']),
          rate: existing ? existing.rate : 0, // rate isn't in this sheet — preserve whatever's already set
        };
        if (!id){ id = newId(); provisions.push(Object.assign({id}, data)); provisionCodeToId[code] = id; }
        else { Object.assign(existing, data); }
        await dbSet('provisions', id, data);
        counts.provisions++;
      }
    }
  } catch(e){ sectionErrors.push('Provisions: ' + (e.message||e)); }

  // 3) Branches — needs the kitchen map from step 1
  try{
    const bRows = sheetRows('Kitchen_wise_Branch_List');
    if (bRows){
      status.textContent = `Importing ${bRows.length} branches…`;
      for (const row of bRows){
        const kCode = cleanImportedText(row['KITCHEN_ID']);
        const campusId = cleanImportedText(row['CAMPUS_ID']);
        const kitchenId = kitchenCodeToId[kCode];
        if (!kitchenId || !campusId) continue; // can't place a branch without a known kitchen
        let existing = branches.find(b => b.kitchenId===kitchenId && b.campusId===campusId);
        const data = {
          kitchenId, campusId,
          name: cleanImportedText(row['CAMPUS_NAME']),
          acType: cleanImportedText(row['STU_TYPE']) || 'AC',
          intType: cleanImportedText(row['INT_TYPE']) || 'SCHOOL',
          foodSupplied: cleanImportedText(row['FOOD_SUPPLIED']) || 'Mandatory',
          active: true,
        };
        if (!existing){ const id = newId(); existing = Object.assign({id}, data); branches.push(existing); await dbSet('branches', id, data); }
        else { Object.assign(existing, data); await dbSet('branches', existing.id, data); }
        counts.branches++;
      }
    }
  } catch(e){ sectionErrors.push('Branches: ' + (e.message||e)); }

  // 4) Opening balances — seeds a starting day so the cascade has somewhere to carry
  // forward from. Written straight into dailyEntries for the given date, per kitchen.
  try{
    const obRows = sheetRows('Opening_Closing_Balance');
    if (obRows){
      status.textContent = `Importing ${obRows.length} opening balances…`;
      const byKitchenDate = {}; // "kitchenId|date" -> {provisionId: opening}
      for (const row of obRows){
        const kCode = cleanImportedText(row['KITCHEN_ID']);
        const pCode = cleanImportedText(row['PROVISION ID']);
        const kitchenId = kitchenCodeToId[kCode];
        const provisionId = provisionCodeToId[pCode];
        if (!kitchenId || !provisionId) continue;
        let dateVal = row['OPENING BALANCE DATE'];
        let dateStr = (dateVal instanceof Date) ? isoDate(dateVal) : currentDate;
        const key = kitchenId + '|' + dateStr;
        if (!byKitchenDate[key]) byKitchenDate[key] = {};
        byKitchenDate[key][provisionId] = +row['OPENING BALANCE'] || 0;
        counts.openingBalances++;
      }
      for (const key of Object.keys(byKitchenDate)){
        const [kitchenId, dateStr] = key.split('|');
        const day = await getDay(kitchenId, dateStr);
        Object.entries(byKitchenDate[key]).forEach(([provisionId, opening])=>{
          if (!day.provisions[provisionId]){
            const pm = provisions.find(p=>p.id===provisionId);
            day.provisions[provisionId] = { opening, recvVendor:0,recvBulk:0,recvOther:0,recvBakery:0, issued:0, rate: pm?pm.rate:0, dish:{}, _openingIsCarried:false, _rateIsCarried:false };
          } else {
            day.provisions[provisionId].opening = opening;
          }
        });
        await saveDay(kitchenId, dateStr);
      }
    }
  } catch(e){ sectionErrors.push('Opening balances: ' + (e.message||e)); }

  // 5) Session & category targets
  try{
    const tRows = sheetRows('Targets');
    if (tRows){
      status.textContent = `Importing ${tRows.length} target rows…`;
      for (const row of tRows){
        const kCode = cleanImportedText(row['KITCHEN_ID']);
        const kitchenId = kitchenCodeToId[kCode];
        if (!kitchenId) continue;
        const data = {
          breakfast: +row['BREAKFAST TARGET PER HEAD'] || 0,
          lunch: +row['LUNCH TARGET PER HEAD'] || 0,
          snacks: +row['SNACKS TARGET PER HEAD'] || 0,
          dinner: +row['DINNER TARGET PER HEAD'] || 0,
          rice: +row['RICE TARGET PER HEAD'] || 0,
          milkCurd: +row['MILK & CURD TARGET PER HEAD'] || 0,
          gasDiesel: +row['GAS & DIESEL TARGET PER HEAD'] || 0,
          firewood: +row['FIRE WOOD & PILLETS TARGET PER HEAD'] || 0,
        };
        await dbSet('sessionTargets', kitchenId, data);
        counts.targets++;
      }
    }
  } catch(e){ sectionErrors.push('Targets: ' + (e.message||e)); }

  const uniqueKitchenNote = multiBakeryKitchens.length
    ? `<br>ℹ️ ${multiBakeryKitchens.length} kitchen row(s) shared a Kitchen ID with an earlier row and were correctly recognized as extra bakeries for the SAME kitchen, not duplicates: ${multiBakeryKitchens.join(', ')}.`
    : '';
  const errorNote = sectionErrors.length
    ? `<br><b style="color:#b91c1c;">⚠ ${sectionErrors.length} section(s) failed — usually means your Firestore Security Rules on the live project are out of date; re-publish the latest firestore.rules and try again:</b><br>${sectionErrors.map(e=>'• '+escapeAttr(e)).join('<br>')}`
    : '';
  status.innerHTML = `✓ Done — ${counts.kitchens} kitchen rows processed (${kitchens.length} unique kitchens), ${counts.provisions} provisions, ${counts.branches} branches, ${counts.openingBalances} opening balances, ${counts.targets} target rows.${uniqueKitchenNote}${errorNote}`;
  toast(sectionErrors.length ? 'Import finished with errors' : 'Master data imported');
  setTimeout(renderMaster, sectionErrors.length ? 15000 : 2500); // leave error messages up longer
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  const tabs = [];
  if (currentRole.role === 'admin' || currentRole.role === 'dataentry') tabs.push(['entry','Daily entry']);
  tabs.push(['reports','Reports']); // every role gets this — stock & consumption, scoped to what they can see
  if (currentRole.role === 'admin' || currentRole.role === 'director') tabs.push(['dashboard','Dashboard']);
  if (currentRole.role === 'admin') tabs.push(['master','Master data']);
  bar.innerHTML = tabs.map(([k,l],i)=>`<div class="tab${i===0?' active':''}" data-view="${k}">${l}</div>`).join('');
  bar.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>switchTab(t.dataset.view));
  });
}
async function switchTab(view){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.view===view));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  const el = document.getElementById('view-'+view);
  if (!el) return;
  el.classList.add('active');
  if (view === 'entry') await renderEntry();
  else if (view === 'dashboard') await renderDashboard();
  else if (view === 'master') await renderMaster();
  else if (view === 'reports') await renderReports();
}

// ============================================================
// DAILY ENTRY — the menu (which dishes are made) changes every day and differs per
// kitchen, so "today's dishes" are picked explicitly each day, not assumed fixed.
// Recipes are kitchen-specific and remember only WHICH provisions a dish usually needs
// (never the quantity) — quantity is always typed fresh, since consumption varies daily.
// ============================================================
function dayDocId(kitchenId, date){ return kitchenId + '_' + date; }
function emptyDay(kitchenId, date){ return { kitchenId, date, status:'draft', selectedDishIds:[], provisions:{}, campuses:{}, distribution:{} }; }
function recipeDocId(kitchenId, menuItemId){ return kitchenId + '::' + menuItemId; }

async function getDay(kitchenId, date){
  const key = dayDocId(kitchenId, date);
  if (dayCache[key]) return dayCache[key];
  const d = await dbGet('dailyEntries', key) || emptyDay(kitchenId, date);
  dayCache[key] = d;
  return d;
}
async function saveDay(kitchenId, date){
  const key = dayDocId(kitchenId, date);
  await dbSet('dailyEntries', key, dayCache[key]);
}

async function getPrevDayCarry(kitchenId, date, provisionId){
  for (let i=1;i<=60;i++){
    const d = addDays(date, -i);
    const day = await getDay(kitchenId, d);
    const p = day.provisions[provisionId];
    if (p) return { closing: computeClosing(p), rate: p.rate };
  }
  return null;
}
function computeClosing(p){
  const totalQty = (+p.opening||0)+(+p.recvVendor||0)+(+p.recvBulk||0)+(+p.recvOther||0)+(+p.recvBakery||0);
  const totalCons = Object.values(p.dish||{}).reduce((s,q)=>s+(+q||0),0) + (+p.issued||0);
  return totalQty - totalCons;
}
function computeTotals(p){
  const totalQty = (+p.opening||0)+(+p.recvVendor||0)+(+p.recvBulk||0)+(+p.recvOther||0)+(+p.recvBakery||0);
  const totalCons = Object.values(p.dish||{}).reduce((s,q)=>s+(+q||0),0) + (+p.issued||0);
  const totalCost = totalCons * (+p.rate||0);
  const closing = totalQty - totalCons;
  return {totalQty, totalCons, totalCost, closing};
}

async function ensureDayInitialized(kitchenId, date){
  const day = await getDay(kitchenId, date);
  let changed = false;
  for (const p of provisions){
    if (!day.provisions[p.id]){
      const carry = await getPrevDayCarry(kitchenId, date, p.id);
      day.provisions[p.id] = {
        opening: carry ? carry.closing : 0, recvVendor:0, recvBulk:0, recvOther:0, recvBakery:0, issued:0,
        rate: carry ? carry.rate : p.rate, dish: {},
        _openingIsCarried: !!carry, _rateIsCarried: !!carry,
      };
      changed = true;
    }
  }
  const myBranches = branches.filter(b => b.kitchenId === kitchenId);
  for (const b of myBranches){
    if (!day.campuses[b.id]) { day.campuses[b.id] = {students:0,staff:0,subStaff:0,others:0,wastage:{},targetPerHeadKg:0.05}; changed = true; }
  }
  for (const dishId of day.selectedDishIds){
    if (!day.distribution[dishId]) { day.distribution[dishId] = {}; myBranches.forEach(b=>day.distribution[dishId][b.id]='Y'); changed = true; }
  }
  if (changed) await saveDay(kitchenId, date);
  return day;
}

async function renderEntry(){
  const el = document.getElementById('view-entry');
  const myKitchens = kitchens.filter(k => myKitchenIds().includes(k.id));
  if (!currentKitchenId && myKitchens.length) currentKitchenId = myKitchens[0].id;
  el.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          ${myKitchens.length > 1 ? `<label>Kitchen</label><select id="entryKitchen">${myKitchens.map(k=>`<option value="${k.id}" ${k.id===currentKitchenId?'selected':''}>${escapeAttr(k.name)}</option>`).join('')}</select>` : `<b>${myKitchens[0]?escapeAttr(myKitchens[0].name):'No kitchen assigned'}</b>`}
          <label>Date</label>
          <input type="date" id="entryDate" value="${currentDate}">
          <button class="sm" id="prevDayBtn">← Prev day</button>
          <button class="sm" id="nextDayBtn">Next day →</button>
        </div>
        <button class="sm" id="exportXlsxBtn">📥 Download Excel</button>
      </div>
      <div class="note" id="entryHint" style="margin:8px 0 0"></div>
    </div>
    <div id="statusBanner"></div>
    <div id="entryBody"></div>
    <div id="submitCard"></div>
  `;
  const kSel = el.querySelector('#entryKitchen');
  if (kSel) kSel.addEventListener('change', e=>{ currentKitchenId = e.target.value; renderEntry(); });
  el.querySelector('#entryDate').addEventListener('change', e=>{ currentDate = e.target.value; renderEntry(); });
  el.querySelector('#prevDayBtn').addEventListener('click', ()=>{ currentDate = addDays(currentDate,-1); renderEntry(); });
  el.querySelector('#nextDayBtn').addEventListener('click', ()=>{ currentDate = addDays(currentDate,1); renderEntry(); });
  el.querySelector('#exportXlsxBtn').addEventListener('click', exportDayToExcel);

  if (!currentKitchenId){ document.getElementById('entryBody').innerHTML = '<div class="card">No kitchen assigned to your account yet — ask your admin.</div>'; return; }

  const day = await ensureDayInitialized(currentKitchenId, currentDate);
  el.querySelector('#entryHint').textContent = `Editing ${ddmmyyyy(currentDate)} — green italic values carry forward from the day before.`;

  const isSubmitted = day.status === 'submitted';
  const bannerEl = document.getElementById('statusBanner');
  if (isSubmitted){
    bannerEl.innerHTML = `<div class="card" style="background:#f0fdf4;border:2px solid #166534;">
      <div class="row" style="justify-content:space-between">
        <div><b style="color:#166534;">✓ SUBMITTED</b> — ${day.submittedBy?escapeAttr(day.submittedBy)+' · ':''}${day.submittedAt?new Date(day.submittedAt).toLocaleString('en-IN'):''}. This day is locked to protect what's already been reported.</div>
        <button class="sm" id="reopenBtn">🔓 Reopen for editing</button>
      </div></div>`;
    bannerEl.querySelector('#reopenBtn').addEventListener('click', async ()=>{
      if (!confirm('Reopen this day for editing? Anyone with access can then change it until it is submitted again.')) return;
      day.status = 'draft'; delete day.submittedBy; delete day.submittedAt;
      await saveDay(currentKitchenId, currentDate);
      renderEntryPreservingFocus();
    });
  } else {
    bannerEl.innerHTML = '';
  }

  const body = document.getElementById('entryBody');
  body.innerHTML = '';
  body.appendChild(buildCampusesCard(day));
  body.appendChild(buildReceivedStockCard(day));
  body.appendChild(await buildTodaysMenuCard(day));
  const todaysDishes = day.selectedDishIds.map(id => menuItems.find(m=>m.id===id)).filter(Boolean);
  todaysDishes.forEach(m => body.appendChild(buildDishIngredientCard(day, m)));
  body.appendChild(buildProvisionsCard(day)); // shows full table for admin, a compact rate-only form for everyone else
  body.appendChild(buildDistributionCard(day));

  if (isSubmitted && currentRole.role !== 'admin'){
    // lock every input once submitted — editing must go through the explicit Reopen action.
    // Admin is exempt: correcting an operator's mistake (a wrong GRN entry, a typo'd quantity)
    // shouldn't require unlocking the whole day first — admin can fix it directly, in place.
    body.querySelectorAll('input, select, button').forEach(elx => elx.disabled = true);
  }
  if (!isSubmitted || currentRole.role === 'admin'){
    document.getElementById('submitCard').appendChild(buildSubmitCard(day, todaysDishes));
  }
  if (isSubmitted && currentRole.role === 'admin'){
    const note = document.createElement('div'); note.className = 'note';
    note.style.cssText = 'margin:-8px 0 12px;color:#b91c1c;font-weight:600;';
    note.textContent = '⚠ This day is submitted, but as Admin you can still edit it directly — changes save immediately, same as any other day.';
    document.getElementById('statusBanner').appendChild(note);
  }
}

function buildSubmitCard(day, todaysDishes){
  const card = document.createElement('div');
  card.className = 'card';
  card.style.cssText = 'border:2px solid #1d4ed8;';

  const myBranches = branches.filter(b => b.kitchenId === currentKitchenId);
  const totalStrength = myBranches.reduce((s,b)=>{ const c=day.campuses[b.id]||{}; return s+(+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0); },0);
  let totalCost = 0;
  todaysDishes.forEach(m=>{
    provisions.forEach(pm=>{ const p=day.provisions[pm.id]; const q=(p.dish||{})[m.id]; if(q) totalCost += (+q)*(+p.rate||0); });
  });
  let totalWastage = 0;
  myBranches.forEach(b=>{ const c=day.campuses[b.id]||{}; SESSIONS.forEach(s=>{ totalWastage += (+(c.wastage[s]?.waste)||0); }); });
  const anyNegative = provisions.some(pm=>{ const p=day.provisions[pm.id]; return p && computeTotals(p).closing < 0; });

  const warnings = [];
  if (totalStrength === 0) warnings.push("No branch has any strength entered yet — Campuses Details looks empty.");
  if (!todaysDishes.length) warnings.push("No dishes added to Today's Menu yet.");
  if (todaysDishes.length && totalCost === 0) warnings.push("Dishes are added but no ingredient quantities have been entered yet.");
  if (anyNegative) warnings.push("Some provisions show a negative closing balance — check Provisions summary before submitting.");

  card.innerHTML = `<h2>Review &amp; submit</h2>
    <div class="grid4" style="margin-bottom:10px;">
      <div class="metric"><div class="lbl">Total strength</div><div class="val">${totalStrength}</div></div>
      <div class="metric"><div class="lbl">Total cost</div><div class="val">${fmtMoney(totalCost)}</div></div>
      <div class="metric"><div class="lbl">₹ / head (kitchen)</div><div class="val">${fmt(totalStrength>0?totalCost/totalStrength:0,2)}</div></div>
      <div class="metric"><div class="lbl">Wastage</div><div class="val">${fmt(totalWastage,1)} kg</div></div>
    </div>
    ${warnings.length ? `<div class="note" style="color:#b91c1c;font-weight:600;">${warnings.map(w=>'⚠ '+w).join('<br>')}</div>` : `<div class="note" style="color:#166534;font-weight:600;">✓ Looks complete — strength, menu, and consumption are all filled in.</div>`}
    <button class="primary" id="submitDayBtn" style="margin-top:10px;">✓ Submit this day</button>
    <div class="note">Submitting locks today's entry so it can't be accidentally changed later. You (or an admin) can always reopen it if something needs correcting.</div>`;

  card.querySelector('#submitDayBtn').addEventListener('click', async ()=>{
    if (warnings.length && !confirm('There are warnings above — submit anyway?')) return;
    if (!confirm(`Submit ${ddmmyyyy(currentDate)} for ${(kitchens.find(k=>k.id===currentKitchenId)||{}).name}? It will be locked for editing.`)) return;
    day.status = 'submitted';
    day.submittedBy = currentUser.email;
    day.submittedAt = new Date().toISOString();
    await saveDay(currentKitchenId, currentDate);
    toast('Submitted');
    renderEntryPreservingFocus();
  });
  return card;
}



// "Today's Menu" — pick which dishes are being made today, per session. This is the one
// thing that genuinely changes every day, so it's a deliberate pick, not an assumption.
async function buildTodaysMenuCard(day){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>Today's menu</h2>
    <div class="note">Add each dish you're making today. If you've made it here before, its usual ingredient list appears automatically below (in Provisions) — you still type today's actual quantity.</div>
    <div id="todaysDishChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;"></div>
    <div class="row">
      <select id="sessionPick">${SESSIONS.map(s=>`<option>${s}</option>`).join('')}</select>
      <input type="text" id="dishPick" list="dishSuggestions" placeholder="Dish name (e.g. IDLI)" style="width:220px;">
      <datalist id="dishSuggestions">${menuItems.map(m=>`<option value="${escapeAttr(m.name)}">`).join('')}</datalist>
      <button class="sm primary" id="addDishBtn">+ Add to today</button>
    </div>`;
  const chips = card.querySelector('#todaysDishChips');
  const renderChips = ()=>{
    chips.innerHTML = day.selectedDishIds.map(id=>{
      const m = menuItems.find(x=>x.id===id);
      if (!m) return '';
      return `<span style="background:#eef2ff;border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:600;">${escapeAttr(m.session[0]+m.session.slice(1).toLowerCase())} · ${escapeAttr(m.name)} <a href="#" data-remove="${id}" style="color:#b91c1c;text-decoration:none;margin-left:4px;">✕</a></span>`;
    }).join('');
    chips.querySelectorAll('[data-remove]').forEach(a=>a.addEventListener('click', async (e)=>{
      e.preventDefault();
      day.selectedDishIds = day.selectedDishIds.filter(id=>id!==a.dataset.remove);
      await saveDay(currentKitchenId, currentDate);
      renderEntryPreservingFocus();
    }));
  };
  renderChips();

  card.querySelector('#addDishBtn').addEventListener('click', async ()=>{
    const session = card.querySelector('#sessionPick').value;
    const name = card.querySelector('#dishPick').value.trim().toUpperCase();
    if (!name) return;
    let m = menuItems.find(x=>x.name===name && x.session===session);
    if (!m){
      const id = newId(); m = {id, session, name};
      await dbSet('menuItems', id, {session, name});
      menuItems.push(m);
    }
    if (!day.selectedDishIds.includes(m.id)){
      day.selectedDishIds.push(m.id);
      // pre-mark this dish's usual ingredients (from THIS kitchen's recipe) as "expected" —
      // creates the quantity cell so it's ready to fill, but leaves the value blank.
      const rec = await dbGet('recipes', recipeDocId(currentKitchenId, m.id));
      if (rec && rec.ingredients){
        rec.ingredients.forEach(ing=>{
          const p = day.provisions[ing.provisionId];
          if (p && p.dish[m.id] === undefined) p.dish[m.id] = '';
        });
      }
      if (!day.distribution[m.id]){
        day.distribution[m.id] = {};
        branches.filter(b=>b.kitchenId===currentKitchenId).forEach(b=>day.distribution[m.id][b.id]='Y');
      }
      await saveDay(currentKitchenId, currentDate);
    }
    renderEntryPreservingFocus();
  });
  return card;
}

// One compact card PER DISH — this is where consumption is actually typed. Shows only
// ingredients relevant to that dish (not all provisions), pre-filled from this kitchen's
// usual list for it (name only, never quantity), with explicit add/remove. The ingredient
// picker is a strict dropdown sourced only from the master Provisions list (name + UOM) —
// no free text, so a typo can never create a stray near-duplicate provision.
function buildDishIngredientCard(day, m){
  const card = document.createElement('div');
  card.className = 'card';

  let cost = 0;
  const ingredientIds = provisions.filter(pm => day.provisions[pm.id].dish.hasOwnProperty(m.id)).map(pm=>pm.id);
  ingredientIds.forEach(pid=>{ const q = day.provisions[pid].dish[m.id]; if (q) cost += (+q)*(+day.provisions[pid].rate||0); });

  const availableToAdd = provisions.filter(pm => !ingredientIds.includes(pm.id));

  card.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${escapeAttr(m.session[0]+m.session.slice(1).toLowerCase())} · ${escapeAttr(m.name)}</h2>
      <div class="note" style="margin:0">Cost so far: <b>${fmtMoney(cost)}</b></div>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="txt">Ingredient</th><th>UOM</th><th>Available balance</th><th>Qty used today</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="row" style="margin-top:8px;">
      <div class="pickerWrap">
        <input type="text" class="ingPick" placeholder="Search by ID, name, UOM or category…" style="width:340px;">
        <div class="pickerList"></div>
      </div>
      <button class="sm" data-addIng>+ Add ingredient</button>
    </div>`;

  const ingPickInput = card.querySelector('.ingPick');
  const ingPicker = attachProvisionPicker(ingPickInput, card.querySelector('.pickerList'), ()=>availableToAdd);

  const tbody = card.querySelector('tbody');
  const renderRows = ()=>{
    tbody.innerHTML = '';
    ingredientIds.forEach(pid=>{
      const pm = provisions.find(x=>x.id===pid);
      if (!pm) return;
      const p = day.provisions[pid];
      const v = p.dish[m.id];
      const expected = v === '';
      // running balance available FOR THIS DISH = total on hand minus issued minus whatever
      // has already been allocated to every OTHER dish today for the same provision
      const t = computeTotals(p);
      const usedElsewhere = Object.entries(p.dish).reduce((s,[dishId,qty]) => dishId===m.id ? s : s + (+qty||0), 0);
      const availableForThisRow = t.totalQty - (+p.issued||0) - usedElsewhere;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="txt">${escapeAttr(pm.name)}</td><td class="txt">${pm.uom}</td>
        <td class="${availableForThisRow<0?'neg':''}"><b>${fmt(availableForThisRow,1)}</b></td>
        <td><input class="cell${expected?' expected':''}" type="number" step="0.1" value="${v||''}" title="${expected?'Usually used for this dish':''}" data-max="${availableForThisRow}" data-focus-key="${fk('dish',m.id,pid)}"></td>
        <td><button class="sm danger" data-removeIng="${pid}">✕</button></td>`;
      const qtyInput = tr.querySelector('input');
      qtyInput.addEventListener('change', async (e)=>{
        const newQty = +e.target.value || 0;
        // hard block: this dish's quantity can't push the provision's closing balance
        // negative once everything else used today is accounted for
        if (newQty > availableForThisRow){
          alert(`Only ${fmt(availableForThisRow,1)} ${pm.uom} of ${pm.name} is available (after what's already allocated to other dishes today). Entering ${fmt(newQty,1)} would take the closing balance negative, so this can't be saved — please check the actual quantity or add more Received stock first.`);
          e.target.value = v || '';
          return;
        }
        p.dish[m.id] = newQty;
        await saveDay(currentKitchenId, currentDate);
        await updateRecipeFromToday(m.id);
        renderEntryPreservingFocus();
      });
      tr.querySelector('[data-removeIng]').addEventListener('click', async ()=>{
        delete p.dish[m.id];
        await saveDay(currentKitchenId, currentDate);
        await updateRecipeFromToday(m.id);
        renderEntryPreservingFocus();
      });
      tbody.appendChild(tr);
    });
  };
  renderRows();

  card.querySelector('[data-addIng]').addEventListener('click', async ()=>{
    const pid = ingPicker.getSelectedId();
    if (!pid){ alert('Pick an ingredient from the search list first (click a suggestion).'); return; }
    const pm = provisions.find(x=>x.id===pid);
    if (!day.provisions[pm.id]){
      const carry = await getPrevDayCarry(currentKitchenId, currentDate, pm.id);
      day.provisions[pm.id] = { opening: carry?carry.closing:0, recvVendor:0,recvBulk:0,recvOther:0,recvBakery:0, issued:0, rate: carry?carry.rate:pm.rate, dish:{}, _openingIsCarried:!!carry, _rateIsCarried:!!carry };
    }
    day.provisions[pm.id].dish[m.id] = '';
    await saveDay(currentKitchenId, currentDate);
    await updateRecipeFromToday(m.id);
    renderEntryPreservingFocus();
  });

  addSaveControl(card, day);
  return card;
}

// Record deliveries as they arrive (GRN — Goods Received Note). This comes BEFORE dish
// entry in the flow, since what's received today is what determines what's available to
// consume today. Strict dropdown sourced from the master Provisions list — no free text.

  });
  card.innerHTML = `<h2>Stock received today (GRN)</h2>
    <div class="note">Record everything that arrived today — vendor, bulk store, another kitchen's bakery, or another campus — before entering today's menu. This is what determines what's available to cook with.</div>
    <div class="tbl-wrap"><table>

      <tbody>${received.map(pm=>{

          <td><input class="cell" type="number" data-pid="${pm.id}" data-f="recvVendor" data-focus-key="${fk('recv',pm.id,'recvVendor')}" value="${p.recvVendor||''}"></td>

          <td><input class="cell" type="number" data-pid="${pm.id}" data-f="recvBakery" data-focus-key="${fk('recv',pm.id,'recvBakery')}" value="${p.recvBakery||''}"></td></tr>`;

    const pm = provisions.find(x=>x.id===pid);

      day.provisions[pm.id] = { opening: carry?carry.closing:0, recvVendor:0,recvBulk:0,recvOther:0,recvBakery:0, issued:0, rate: carry?carry.rate:pm.rate, dish:{}, _openingIsCarried:!!carry, _rateIsCarried:!!carry };

// Aggregate view of the day — only provisions with SOME activity (opening carried
// forward and nonzero, received today, or used in a dish) are shown, so this stays
// short even with hundreds of provisions in the master list. Opening/Rate/Issued
// stay editable here since they aren't tied to any one dish.
// Aggregate view of the day — only provisions with SOME activity (opening carried
// forward and nonzero, received today, or used in a dish) are shown, so this stays
// short even with hundreds of provisions in the master list. Opening/Rate/Issued
// stay editable here since they aren't tied to any one dish.
// Data-entry doesn't need to see this whole table day-to-day (their Excel export covers
// the same ground, on demand) — only Admin sees it inline, for oversight. Everyone still
// gets a compact "update today's rate" control, since that's the one thing here that
// isn't editable anywhere else.
function buildProvisionsCard(day){
  const activeProvisions = provisions.filter(pm=>{
    const p = day.provisions[pm.id];
    if (!p) return false;
    const t = computeTotals(p);
    return p.opening!==0 || p.recvVendor || p.recvBulk || p.recvOther || p.recvBakery || t.totalCons!==0;
  });
  const card = document.createElement('div');
  card.className = 'card';
  const rateFormHtml = `<div class="row" style="margin-top:8px;">
      <div class="pickerWrap">
        <input type="text" id="ratePick" placeholder="Search a provision to update its rate…" style="width:340px;">
        <div class="pickerList" id="ratePickList"></div>
      </div>
      <input type="number" id="rateNewVal" step="0.01" placeholder="New rate ₹" style="width:100px;">
      <button class="sm primary" id="updateRateBtn">Update rate</button>
    </div>`;

  if (currentRole.role !== 'admin'){
    card.innerHTML = `<h2>Today's rates</h2>
      <div class="note">Full provisions summary isn't shown here — use "📥 Download Excel" above for the complete picture. You can still update a rate directly:</div>
      ${rateFormHtml}`;
    wireRateForm(card, day);
    return card;
  }

  if (!activeProvisions.length){
    card.innerHTML = `<h2>Provisions summary</h2><div class="note">Nothing recorded yet today — add dishes above and their ingredients, or record received stock.</div>${rateFormHtml}`;
    wireRateForm(card, day);
    return card;
  }
  card.innerHTML = `<h2>Provisions summary</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="txt">Provision</th><th>UOM</th><th>Opening</th><th>Received</th><th>Total qty</th>
        <th>Issued</th><th>Total cons.</th><th>Rate</th><th>Total cost</th><th>Closing</th></tr></thead>
      <tbody></tbody></table></div>
    ${rateFormHtml}`;
  const tbody = card.querySelector('tbody');
  activeProvisions.forEach(pm=>{
    const p = day.provisions[pm.id];
    const t = computeTotals(p);
    const recvTotal = (+p.recvVendor||0)+(+p.recvBulk||0)+(+p.recvOther||0)+(+p.recvBakery||0);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="txt">${escapeAttr(pm.name)}</td><td class="txt">${pm.uom}</td>
      <td><input class="cell${p._openingIsCarried?' chained':''}" type="number" data-f="opening" data-focus-key="${fk('provsum',pm.id,'opening')}" value="${p.opening}"></td>
      <td>${fmt(recvTotal,1)}</td>
      <td><b>${fmt(t.totalQty,1)}</b></td>
      <td><input class="cell" type="number" data-f="issued" data-focus-key="${fk('provsum',pm.id,'issued')}" value="${p.issued||''}"></td>
      <td><b>${fmt(t.totalCons,1)}</b></td>
      <td><input class="cell" type="number" step="0.01" data-f="rate" data-focus-key="${fk('provsum',pm.id,'rate')}" value="${p.rate}"></td>
      <td>${fmtMoney(t.totalCost)}</td>
      <td class="${t.closing<0?'neg':''}"><b>${fmt(t.closing,1)}</b></td>`;
    tr.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('change', async ()=>{
      p[inp.dataset.f] = +inp.value||0;
      if (inp.dataset.f==='opening') p._openingIsCarried=false;
      if (inp.dataset.f==='rate') p._rateIsCarried=false;
      await saveDay(currentKitchenId, currentDate); renderEntryPreservingFocus();
    }));
    tbody.appendChild(tr);
  });
  wireRateForm(card, day);
  return card;
}

// Captures the recipe (WHICH provisions, not quantities) through data entry — whatever
// the operator used a provision for today keeps it on that dish's ingredient list, scoped
// to THIS kitchen (another kitchen's Idli recipe is separate). Quantity is never stored
// in the recipe — it's always typed fresh next time.
async function updateRecipeFromToday(menuItemId){
  const day = await getDay(currentKitchenId, currentDate);
  const ingredients = [];
  provisions.forEach(pm=>{
    if (day.provisions[pm.id].dish.hasOwnProperty(menuItemId)) ingredients.push({provisionId: pm.id});
  });
  const recId = recipeDocId(currentKitchenId, menuItemId);
  const rec = { kitchenId: currentKitchenId, menuItemId, ingredients, updatedFrom: currentDate };
  recipes[recId] = rec;
  await dbSet('recipes', recId, rec);
}

function wireRateForm(card, day){
  const ratePicker = attachProvisionPicker(card.querySelector('#ratePick'), card.querySelector('#ratePickList'), ()=>provisions);
  card.querySelector('#updateRateBtn').addEventListener('click', async ()=>{
    const pid = ratePicker.getSelectedId();
    const newRate = +card.querySelector('#rateNewVal').value;
    if (!pid){ alert('Pick a provision from the search list first (click a suggestion).'); return; }
    if (!newRate || newRate <= 0){ alert('Enter a rate greater than 0.'); return; }
    if (!day.provisions[pid]){
      const pm = provisions.find(p=>p.id===pid);
      const carry = await getPrevDayCarry(currentKitchenId, currentDate, pid);
      day.provisions[pid] = { opening: carry?carry.closing:0, recvVendor:0,recvBulk:0,recvOther:0,recvBakery:0, issued:0, rate: newRate, dish:{}, _openingIsCarried:!!carry, _rateIsCarried:false };
    } else {
      day.provisions[pid].rate = newRate;
      day.provisions[pid]._rateIsCarried = false;
    }
    await saveDay(currentKitchenId, currentDate);
    toast('Rate updated');
    renderEntryPreservingFocus();
  });
}

function buildDistributionCard(day){
  const myBranches = branches.filter(b => b.kitchenId === currentKitchenId);
  const todaysDishes = day.selectedDishIds.map(id => menuItems.find(m=>m.id===id)).filter(Boolean);
  const card = document.createElement('div');
  card.className = 'card';
  if (!todaysDishes.length){ card.innerHTML = `<h2>Dish distribution</h2><div class="note">Add today's dishes above first.</div>`; return card; }
  card.innerHTML = `<h2>Dish distribution</h2>
    <div class="note">Mark which branches received each dish today. Cost pulls in automatically from Provisions above.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="txt">Dish</th><th>Cost</th><th>Recipient strength</th><th>₹/head</th>
        ${myBranches.map(b=>`<th>${escapeAttr(b.name.split(' ').slice(-2).join(' '))}</th>`).join('')}</tr></thead>
      <tbody></tbody></table></div>`;
  const tbody = card.querySelector('tbody');
  todaysDishes.forEach(m=>{
    const flags = day.distribution[m.id] || (day.distribution[m.id] = {});
    let cost = 0;
    provisions.forEach(pm=>{ const q = (day.provisions[pm.id].dish||{})[m.id]; if (q) cost += (+q)*(+day.provisions[pm.id].rate||0); });
    let recipStrength = 0;
    myBranches.forEach(b=>{ if (flags[b.id] !== 'N'){ const c = day.campuses[b.id]; recipStrength += (+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0); } });
    const perHead = recipStrength>0 ? cost/recipStrength : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="txt">${escapeAttr(m.name)}</td><td>${fmtMoney(cost)}</td><td>${recipStrength}</td><td><b>${fmt(perHead,3)}</b></td>
      ${myBranches.map(b=>{ const v = flags[b.id]==='N'?'N':'Y'; return `<td><select class="cell yn ${v.toLowerCase()}" data-branch="${b.id}"><option ${v==='Y'?'selected':''}>Y</option><option ${v==='N'?'selected':''}>N</option></select></td>`; }).join('')}`;
    tr.querySelectorAll('[data-branch]').forEach(sel=>sel.addEventListener('change', async ()=>{
      flags[sel.dataset.branch] = sel.value; await saveDay(currentKitchenId, currentDate); renderEntryPreservingFocus();
    }));
    tbody.appendChild(tr);
  });
  return card;
}

async function exportDayToExcel(){
  const day = await ensureDayInitialized(currentKitchenId, currentDate);
  const kitchenName = (kitchens.find(k=>k.id===currentKitchenId)||{}).name || currentKitchenId;

    provRows.push([pm.provisionId||'', pm.name, pm.uom, pm.category, p.opening, p.recvVendor||0, t.totalQty, p.issued||0, t.totalCons, p.rate, t.totalCost, t.closing]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(provRows), 'Provisions');
  const branchRows = [['Branch','Type','Students','Staff','Sub Staff','Others','Total']];
  branches.filter(b=>b.kitchenId===currentKitchenId).forEach(b=>{ const c=day.campuses[b.id]||{};
    branchRows.push([b.name,b.acType,c.students||0,c.staff||0,c.subStaff||0,c.others||0,(+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0)]); });

}
