// DASHBOARD
// ============================================================
// Computes every per-head metric for ONE kitchen on ONE date — used both for the single-day
// dashboard view and, looped across a range, for the Period Average (with zero-days excluded
// from each average, per your correction).
const CATEGORY_DEFS = [
  ['Rice', 'rice', p=>p.category==='RICE'],
  ['Milk & Curd', 'milkCurd', p=>p.category==='MILK'||p.category==='CURD'],
  ['Gas & Diesel', 'gasDiesel', p=>p.category==='GAS / DIESEL'],
  ['Firewood & Pillets', 'firewood', p=>p.category==='PILLETS / FIREWOOD'],
];
async function computeDayMetrics(kitchenId, date){
  const day = await ensureDayInitialized(kitchenId, date);
  const myBranches = branches.filter(b => b.kitchenId === kitchenId);
  const todaysDishes = day.selectedDishIds.map(id => menuItems.find(m=>m.id===id)).filter(Boolean);

  const dishInfo = {};
  todaysDishes.forEach(m=>{
    const flags = day.distribution[m.id] || {};
    let cost = 0;
    provisions.forEach(pm=>{ const q=(day.provisions[pm.id].dish||{})[m.id]; if(q) cost += (+q)*(+day.provisions[pm.id].rate||0); });
    dishInfo[m.id] = {cost, flags};
  });
  const branchStrength = {};
  myBranches.forEach(b=>{ const c=day.campuses[b.id]||{}; branchStrength[b.id]=(+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0); });
  const dishRecipStrength = {};
  todaysDishes.forEach(m=>{ let s=0; myBranches.forEach(b=>{ if((dishInfo[m.id].flags[b.id]||'Y')!=='N') s+=branchStrength[b.id]; }); dishRecipStrength[m.id]=s; });
  const branchPerHead = {};
  myBranches.forEach(b=>{ let total=0; todaysDishes.forEach(m=>{ if((dishInfo[m.id].flags[b.id]||'Y')!=='N' && dishRecipStrength[m.id]>0) total += dishInfo[m.id].cost/dishRecipStrength[m.id]; }); branchPerHead[b.id]=total; });

  const kitchenTotalStrength = myBranches.reduce((s,b)=>s+branchStrength[b.id],0);
  const sessionActual = {};
  SESSIONS.forEach(s=>{
    let cost = 0;
    todaysDishes.filter(m=>m.session===s).forEach(m=> cost += dishInfo[m.id].cost);
    sessionActual[s] = kitchenTotalStrength>0 ? cost/kitchenTotalStrength : 0;
  });
  const categoryActual = {};
  CATEGORY_DEFS.forEach(([label,key,matchFn])=>{
    let cost = 0;
    provisions.filter(matchFn).forEach(pm=>{
      const p = day.provisions[pm.id];
      if (p) Object.values(p.dish||{}).forEach(q=>{ if(q) cost += (+q)*(+p.rate||0); });
    });
    categoryActual[key] = kitchenTotalStrength>0 ? cost/kitchenTotalStrength : 0;
  });
  const acTypeActual = {};
  AC_TYPES.forEach(t=>{
    const bs = myBranches.filter(b=>b.acType===t);
    const strength = bs.reduce((s,b)=>s+branchStrength[b.id],0);
    const cost = bs.reduce((s,b)=>s+branchPerHead[b.id]*branchStrength[b.id],0);
    acTypeActual[t] = strength>0 ? cost/strength : 0;
  });
  const overallCost = myBranches.reduce((s,b)=>s+branchPerHead[b.id]*branchStrength[b.id],0);
  const overallPerHead = kitchenTotalStrength>0 ? overallCost/kitchenTotalStrength : 0;

  return { day, myBranches, todaysDishes, dishInfo, branchStrength, branchPerHead, kitchenTotalStrength, sessionActual, categoryActual, acTypeActual, overallPerHead };
}

async function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  const myKitchens = kitchens.filter(k => myKitchenIds().includes(k.id));
  if (!currentKitchenId && myKitchens.length) currentKitchenId = myKitchens[0].id;
  if (reportFromDate === null) reportFromDate = addDays(currentDate, -6);
  if (reportToDate === null) reportToDate = currentDate;
  el.innerHTML = `
    <div class="card"><div class="row">
      ${myKitchens.length > 1 ? `<label>Kitchen</label><select id="dashKitchen">${myKitchens.map(k=>`<option value="${k.id}" ${k.id===currentKitchenId?'selected':''}>${escapeAttr(k.name)}</option>`).join('')}</select>` : `<b>${myKitchens[0]?escapeAttr(myKitchens[0].name):'No kitchen'}</b>`}
      <label>Date</label><input type="date" id="dashDate" value="${currentDate}">
      <label style="margin-left:14px">Consumption report: from</label><input type="date" id="repFrom" value="${reportFromDate}">
      <label>to</label><input type="date" id="repTo" value="${reportToDate}">
    </div></div>
    <div id="dashBody"></div>`;
  const kSel = el.querySelector('#dashKitchen');
  if (kSel) kSel.addEventListener('change', e=>{ currentKitchenId = e.target.value; renderDashboard(); });
  el.querySelector('#dashDate').addEventListener('change', e=>{ currentDate = e.target.value; renderDashboard(); });
  el.querySelector('#repFrom').addEventListener('change', e=>{ reportFromDate = e.target.value; renderDashboard(); });
  el.querySelector('#repTo').addEventListener('change', e=>{ reportToDate = e.target.value; renderDashboard(); });

  // Bird's-eye view across every kitchen you have access to — genuinely useful once you're
  // overseeing dozens of kitchens, not just one. Deliberately lightweight: reads each
  // kitchen's already-saved day doc directly rather than running the full cascade-init
  // logic 45 times over, so this stays fast even at real scale.
  if (myKitchens.length > 1){
    const overviewCard = document.createElement('div'); overviewCard.className='card';
    overviewCard.innerHTML = `<h2>All kitchens — ${ddmmyyyy(currentDate)}</h2><div class="note">Click a row to open that kitchen below.</div><div class="tbl-wrap" id="overviewTblWrap"><div class="note">Loading…</div></div>`;
    el.insertBefore(overviewCard, document.getElementById('dashBody'));
    (async ()=>{
      const rows = [];
      for (const k of myKitchens){
        const dayDoc = await dbGet('dailyEntries', dayDocId(k.id, currentDate));
        const kBranches = branches.filter(b=>b.kitchenId===k.id);
        if (!dayDoc){ rows.push({k, strength:0, cost:0, hasData:false}); continue; }
        const kStrength = {}; kBranches.forEach(b=>{ const c=dayDoc.campuses[b.id]||{}; kStrength[b.id]=(+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0); });
        let totalCost = 0;
        (dayDoc.selectedDishIds||[]).forEach(mid=>{
          const flags = dayDoc.distribution[mid]||{};
          let dishCost = 0;
          Object.entries(dayDoc.provisions||{}).forEach(([pid,p])=>{ const q=(p.dish||{})[mid]; if(q) dishCost += (+q)*(+p.rate||0); });
          totalCost += dishCost; // approximate: counted once per dish, allocated below by recipient strength
        });
        const totalStrength = kBranches.reduce((s,b)=>s+kStrength[b.id],0);
        rows.push({k, strength: totalStrength, cost: totalCost, hasData: true});
      }
      const wrap = document.getElementById('overviewTblWrap');
      if (!wrap) return; // user navigated away before this finished
      wrap.innerHTML = `<table><thead><tr><th class="txt">Kitchen</th><th class="txt">Division</th><th>Strength</th><th>Total cost</th><th>₹/head</th><th></th></tr></thead>
        <tbody>${rows.map(r=>`<tr style="cursor:pointer" data-kid="${r.k.id}">
          <td class="txt">${escapeAttr(r.k.name)}</td><td class="txt">${escapeAttr(r.k.division||'')}</td>
          <td>${r.hasData?r.strength:'—'}</td><td>${r.hasData?fmtMoney(r.cost):'—'}</td>
          <td><b>${r.hasData && r.strength>0 ? fmt(r.cost/r.strength,2) : '—'}</b></td>
          <td>${r.k.id===currentKitchenId?'<span class="badge ok">viewing</span>':''}</td>
        </tr>`).join('')}</tbody></table>`;
      wrap.querySelectorAll('[data-kid]').forEach(tr=>tr.addEventListener('click', ()=>{ currentKitchenId = tr.dataset.kid; renderDashboard(); }));
    })();
  }

  if (!currentKitchenId){ document.getElementById('dashBody').innerHTML = '<div class="card">No kitchen assigned.</div>'; return; }

  const day = await ensureDayInitialized(currentKitchenId, currentDate);
  const myBranches = branches.filter(b => b.kitchenId === currentKitchenId);
  const todaysDishes = day.selectedDishIds.map(id => menuItems.find(m=>m.id===id)).filter(Boolean);
  let target = {AC:0,'SEMI-AC':0,'NON-AC':0};
  try{ target = (await dbGet('targets', currentKitchenId)) || target; } catch(e){ console.warn('targets read failed (permissions?)', e); }

  const dishInfo = {};
  todaysDishes.forEach(m=>{
    const flags = day.distribution[m.id] || {};
    let cost = 0;
    provisions.forEach(pm=>{ const q=(day.provisions[pm.id].dish||{})[m.id]; if(q) cost += (+q)*(+day.provisions[pm.id].rate||0); });
    dishInfo[m.id] = {cost, flags};
  });
  const branchStrength = {};
  myBranches.forEach(b=>{ const c=day.campuses[b.id]||{}; branchStrength[b.id]=(+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0); });
  const dishRecipStrength = {};
  todaysDishes.forEach(m=>{ let s=0; myBranches.forEach(b=>{ if((dishInfo[m.id].flags[b.id]||'Y')!=='N') s+=branchStrength[b.id]; }); dishRecipStrength[m.id]=s; });
  const branchPerHead = {};
  myBranches.forEach(b=>{ let total=0; todaysDishes.forEach(m=>{ if((dishInfo[m.id].flags[b.id]||'Y')!=='N' && dishRecipStrength[m.id]>0) total += dishInfo[m.id].cost/dishRecipStrength[m.id]; }); branchPerHead[b.id]=total; });

  const body = document.getElementById('dashBody');
  body.innerHTML = '';

  // --- Strength Coverage ---
  const totalStudents = myBranches.reduce((s,b)=>s+(+((day.campuses[b.id]||{}).students)||0),0);
  const totalStaff = myBranches.reduce((s,b)=>s+(+((day.campuses[b.id]||{}).staff)||0),0);
  const totalSubStaff = myBranches.reduce((s,b)=>s+(+((day.campuses[b.id]||{}).subStaff)||0),0);
  const totalOthers = myBranches.reduce((s,b)=>s+(+((day.campuses[b.id]||{}).others)||0),0);
  const grandTotalStrength = totalStudents+totalStaff+totalSubStaff+totalOthers;
  const branchesReporting = myBranches.filter(b=>{ const c=day.campuses[b.id]||{}; return (+c.students||0)+(+c.staff||0)+(+c.subStaff||0)+(+c.others||0) > 0; }).length;
  const scCard = document.createElement('div'); scCard.className='card';
  scCard.innerHTML = `<h2>Strength coverage — ${ddmmyyyy(currentDate)}</h2>
    <div class="grid4">
      <div class="metric"><div class="lbl">Students</div><div class="val">${totalStudents}</div></div>
      <div class="metric"><div class="lbl">Staff</div><div class="val">${totalStaff}</div></div>
      <div class="metric"><div class="lbl">Sub staff</div><div class="val">${totalSubStaff}</div></div>
      <div class="metric"><div class="lbl">Others</div><div class="val">${totalOthers}</div></div>
      <div class="metric" style="background:#eef2ff;"><div class="lbl">Total strength</div><div class="val">${grandTotalStrength}</div></div>
      <div class="metric"><div class="lbl">Branches reporting</div><div class="val">${branchesReporting} / ${myBranches.length}</div></div>
    </div>`;
  body.appendChild(scCard);

  // --- Session & Category targets (matches your existing Target Per Head sheet) ---
  let sessionTarget = {};
  try{ sessionTarget = (await dbGet('sessionTargets', currentKitchenId)) || {}; } catch(e){ console.warn('sessionTargets read failed (permissions?)', e); }
  const kitchenTotalStrengthForTargets = myBranches.reduce((s,b)=>s+branchStrength[b.id],0);
  const sessionActual = {};
  SESSIONS.forEach(s=>{
    let cost = 0;
    todaysDishes.filter(m=>m.session===s).forEach(m=> cost += dishInfo[m.id].cost);
    sessionActual[s] = kitchenTotalStrengthForTargets>0 ? cost/kitchenTotalStrengthForTargets : 0;
  });
  const categoryDefs = [
    ['Rice', 'rice', p=>p.category==='RICE'],
    ['Milk & Curd', 'milkCurd', p=>p.category==='MILK'||p.category==='CURD'],
    ['Gas & Diesel', 'gasDiesel', p=>p.category==='GAS / DIESEL'],
    ['Firewood & Pillets', 'firewood', p=>p.category==='PILLETS / FIREWOOD'],
  ];
  const categoryActual = {};
  categoryDefs.forEach(([label,key,matchFn])=>{
    let cost = 0;
    provisions.filter(matchFn).forEach(pm=>{
      const p = day.provisions[pm.id];
      if (p) Object.values(p.dish||{}).forEach(q=>{ if(q) cost += (+q)*(+p.rate||0); });
    });
    categoryActual[key] = kitchenTotalStrengthForTargets>0 ? cost/kitchenTotalStrengthForTargets : 0;
  });
  const stCard = document.createElement('div'); stCard.className='card';
  stCard.innerHTML = `<h2>Session &amp; category — actual vs target ₹/head</h2>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">Meal / category</th><th>Actual</th><th>Target</th><th>Status</th></tr></thead>
    <tbody>
      ${SESSIONS.map(s=>{
        const actual = sessionActual[s]; const tgt = sessionTarget[s.toLowerCase()]||0; const over = tgt>0 && actual>tgt;
        return `<tr><td class="txt">${s[0]+s.slice(1).toLowerCase()}</td><td><b>${fmt(actual,2)}</b></td><td>${tgt?fmt(tgt,2):'—'}</td><td>${tgt?(over?'<span class="badge over">⚠ over</span>':'<span class="badge ok">✓ within</span>'):'—'}</td></tr>`;
      }).join('')}
      ${categoryDefs.map(([label,key])=>{
        const actual = categoryActual[key]; const tgt = sessionTarget[key]||0; const over = tgt>0 && actual>tgt;
        return `<tr><td class="txt">${label}</td><td><b>${fmt(actual,2)}</b></td><td>${tgt?fmt(tgt,2):'—'}</td><td>${tgt?(over?'<span class="badge over">⚠ over</span>':'<span class="badge ok">✓ within</span>'):'—'}</td></tr>`;
      }).join('')}
    </tbody></table></div>`;
  body.appendChild(stCard);

  // --- Budget Alerts (with item-level drill-down, like your original dashboard) ---
  const ALERT_THRESHOLD_PCT = 10;
  const alerts = [];
  SESSIONS.forEach(s=>{
    const tgt = sessionTarget[s.toLowerCase()]||0;
    const actual = sessionActual[s];
    if (tgt>0 && actual>tgt){ alerts.push({label: s[0]+s.slice(1).toLowerCase(), pctOver: (actual-tgt)/tgt*100, actual, tgt, isSession:true, sessionKey:s}); }
  });
  categoryDefs.forEach(([label,key])=>{
    const tgt = sessionTarget[key]||0; const actual = categoryActual[key];
    if (tgt>0 && actual>tgt){ alerts.push({label, pctOver:(actual-tgt)/tgt*100, actual, tgt, isSession:false}); }
  });
  alerts.sort((a,b)=>b.pctOver-a.pctOver);
  const abCard = document.createElement('div'); abCard.className='card';
  if (!alerts.length){
    abCard.style.cssText='border-top:3px solid #059669;';
    abCard.innerHTML = `<h2>Budget alerts</h2><p class="note" style="color:#166534;font-weight:600;">✓ Nothing is over target today.</p>`;
  } else {
    abCard.style.cssText='border-top:3px solid #e11d48;';
    const rowsHtml = alerts.map(a=>{
      let driver = '';
      if (a.isSession){
        // find the single provision item contributing the most cost to this session's dishes
        const costByItem = {};
        todaysDishes.filter(m=>m.session===a.sessionKey).forEach(m=>{
          provisions.forEach(pm=>{ const p=day.provisions[pm.id]; const q=(p.dish||{})[m.id]; if(q) costByItem[pm.id]=(costByItem[pm.id]||0)+(+q)*(+p.rate||0); });
        });
        const topId = Object.keys(costByItem).sort((x,y)=>costByItem[y]-costByItem[x])[0];
        if (topId){
          const pm = provisions.find(p=>p.id===topId);
          const perHead = kitchenTotalStrengthForTargets>0 ? costByItem[topId]/kitchenTotalStrengthForTargets : 0;
          driver = `🔍 <b>${escapeAttr(pm.name)}</b> · ${fmt(perHead,2)}/head`;
        }
      }
      return `<div style="padding:8px 0;border-bottom:1px solid #fecaca;">
        <div class="row" style="justify-content:space-between"><b>${a.label}</b><span class="badge over">+${fmt(a.pctOver,0)}%</span></div>
        <div class="note" style="margin:2px 0 0;">${fmt(a.actual,2)} vs target ${fmt(a.tgt,2)}${driver?' · '+driver:''}</div>
      </div>`;
    }).join('');
    abCard.innerHTML = `<h2>Budget alerts (${alerts.length})</h2>${rowsHtml}`;
  }
  body.appendChild(abCard);

  // --- Particulars — category × session breakdown (qty, qty/head, amount, amount/head) ---
  const PARTICULARS_CATEGORIES = ['RICE','MILK','CURD','OILS','EGGS','CHICKEN / NON-VEG','BAKERY','PILLETS / FIREWOOD','GAS / DIESEL','ROTI','FRUITS','VEGETABLES','PROVISIONS'];
  const partData = {}; // category -> session -> {qty, amt}
  PARTICULARS_CATEGORIES.forEach(cat=>{
    partData[cat] = {};
    SESSIONS.forEach(s=>{
      let qty=0, amt=0;
      provisions.filter(pm=>pm.category===cat).forEach(pm=>{
        const p = day.provisions[pm.id];
        if (!p) return;
        todaysDishes.filter(m=>m.session===s).forEach(m=>{
          const q = (p.dish||{})[m.id];
          if (q){ qty += (+q); amt += (+q)*(+p.rate||0); }
        });
      });
      partData[cat][s] = {qty, amt};
    });
  });
  const partCard = document.createElement('div'); partCard.className='card';
  partCard.innerHTML = `<h2>Particulars — consumption &amp; amount by session</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th class="txt" rowspan="2">Category</th>${SESSIONS.map(s=>`<th colspan="2">${s[0]+s.slice(1).toLowerCase()}</th>`).join('')}<th colspan="2">Total</th></tr>
      <tr>${SESSIONS.map(()=>`<th>Qty</th><th>₹</th>`).join('')}<th>Qty</th><th>₹</th></tr></thead>
      <tbody>
        ${PARTICULARS_CATEGORIES.map(cat=>{
          let totQty=0, totAmt=0;
          const cells = SESSIONS.map(s=>{ const d=partData[cat][s]; totQty+=d.qty; totAmt+=d.amt; return `<td>${d.qty?fmt(d.qty,1):'—'}</td><td>${d.amt?fmtMoney(d.amt):'—'}</td>`; }).join('');
          return `<tr><td class="txt">${cat}</td>${cells}<td><b>${totQty?fmt(totQty,1):'—'}</b></td><td><b>${totAmt?fmtMoney(totAmt):'—'}</b></td></tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  body.appendChild(partCard);

  // --- AC / Semi-AC / Non-AC vs Target ---
  const catCard = document.createElement('div'); catCard.className='card';
  catCard.innerHTML = `<h2>AC / Semi-AC / Non-AC — actual vs target ₹/head</h2><div class="grid4" id="catGrid"></div>`;
  const catGrid = catCard.querySelector('#catGrid');
  let kitchenTotalCost = 0, kitchenTotalStrength = 0;
  AC_TYPES.forEach(t=>{
    const bs = myBranches.filter(b=>b.acType===t);
    const strength = bs.reduce((s,b)=>s+branchStrength[b.id],0);
    const cost = bs.reduce((s,b)=>s+branchPerHead[b.id]*branchStrength[b.id],0);
    const perHead = strength>0 ? cost/strength : 0;
    kitchenTotalCost += cost; kitchenTotalStrength += strength;
    const tgt = target[t] || 0;
    const over = tgt>0 && perHead>tgt;
    const m = document.createElement('div'); m.className='metric';
    m.innerHTML = `<div class="lbl">${t}</div><div class="val" style="${over?'color:#b91c1c':''}">${fmt(perHead,2)}</div>
      <div class="note" style="margin:2px 0 0">strength ${strength} · target ${tgt?fmt(tgt,0):'—'} ${tgt?(over?'⚠ over':'✓ within'):''}</div>`;
    catGrid.appendChild(m);
  });
  // overall kitchen-wide metric
  const overallM = document.createElement('div'); overallM.className='metric'; overallM.style.background='#eef2ff';
  overallM.innerHTML = `<div class="lbl">Overall kitchen</div><div class="val">${fmt(kitchenTotalStrength>0?kitchenTotalCost/kitchenTotalStrength:0,2)}</div><div class="note" style="margin:2px 0 0">strength ${kitchenTotalStrength} · all branches blended</div>`;
  catGrid.appendChild(overallM);
  body.appendChild(catCard);

  // --- Per-branch summary ---
  const brCard = document.createElement('div'); brCard.className='card';
  brCard.innerHTML = `<h2>Per-branch summary</h2><div class="tbl-wrap"><table><thead><tr><th class="txt">Branch</th><th class="txt">Type</th><th>Strength</th><th>₹/head</th><th>Total cost</th></tr></thead>
    <tbody>${myBranches.map(b=>`<tr><td class="txt">${escapeAttr(b.name)}</td><td class="txt">${b.acType}</td><td>${branchStrength[b.id]}</td><td><b>${fmt(branchPerHead[b.id],2)}</b></td><td>${fmtMoney(branchPerHead[b.id]*branchStrength[b.id])}</td></tr>`).join('')}</tbody></table></div>`;
  body.appendChild(brCard);

  // --- Wastage ---
  let totalWaste = 0;
  const branchWaste = {};
  myBranches.forEach(b=>{
    const c = day.campuses[b.id] || {};
    let w = 0; SESSIONS.forEach(s=>{ w += (+(c.wastage[s]?.waste)||0); });
    branchWaste[b.id] = w; totalWaste += w;
  });
  const wCard = document.createElement('div'); wCard.className='card';
  wCard.innerHTML = `<h2>Wastage</h2>
    <div class="grid4" style="margin-bottom:10px;">
      <div class="metric"><div class="lbl">Total wastage</div><div class="val">${fmt(totalWaste,1)} kg</div></div>
      <div class="metric"><div class="lbl">Avg per head</div><div class="val">${kitchenTotalStrength>0?fmt(totalWaste/kitchenTotalStrength*1000,0):0} g</div></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">Branch</th><th>Wastage kg</th><th>Target kg/head</th><th>Actual kg/head</th></tr></thead>
      <tbody>${myBranches.map(b=>{ const c=day.campuses[b.id]||{}; const s=branchStrength[b.id]; const actual = s>0?branchWaste[b.id]/s:0; const tgt=+c.targetPerHeadKg||0; const over = tgt>0 && actual>tgt;
        return `<tr><td class="txt">${escapeAttr(b.name)}</td><td>${fmt(branchWaste[b.id],2)}</td><td>${fmt(tgt,3)}</td><td class="${over?'neg':''}"><b>${fmt(actual,3)}</b></td></tr>`; }).join('')}</tbody></table></div>`;
  body.appendChild(wCard);

  body.appendChild(await buildStockCard(currentKitchenId, currentDate));
  body.appendChild(await buildPeriodAverageCard(currentKitchenId, reportFromDate, reportToDate));
  body.appendChild(await buildConsumptionCard(currentKitchenId, reportFromDate, reportToDate));
}

// --- In-hand stock (current closing balance of every provision) — shared by Dashboard and Reports ---
async function buildStockCard(kitchenId, date){
  const day = await ensureDayInitialized(kitchenId, date);
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>In-hand stock — as of ${ddmmyyyy(date)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">Provision</th><th class="txt">Category</th><th>UOM</th><th>Closing balance</th><th>Value ₹</th></tr></thead>
      <tbody>${provisions.map(pm=>{ const p=day.provisions[pm.id]; const t=computeTotals(p);
        return `<tr><td class="txt">${escapeAttr(pm.name)}</td><td class="txt">${escapeAttr(pm.category)}</td><td class="txt">${pm.uom}</td><td class="${t.closing<0?'neg':''}"><b>${fmt(t.closing,1)}</b></td><td>${fmtMoney(t.closing*(+p.rate||0))}</td></tr>`; }).join('')}</tbody></table></div>`;
  return card;
}

// --- Provision-wise consumption report over a date range — shared by Dashboard and Reports ---
async function buildConsumptionCard(kitchenId, fromDate, toDate){
  const consTotals = {};
  provisions.forEach(pm=>consTotals[pm.id]={qty:0,cost:0});
  let d = fromDate; let guard = 0;
  while (d <= toDate && guard < 370){
    const dd = await getDay(kitchenId, d);
    provisions.forEach(pm=>{
      const p = dd.provisions[pm.id];
      if (p){ const t = computeTotals(p); consTotals[pm.id].qty += t.totalCons; consTotals[pm.id].cost += t.totalCost; }
    });
    d = addDays(d, 1); guard++;
  }
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>Provision-wise consumption — ${ddmmyyyy(fromDate)} to ${ddmmyyyy(toDate)}</h2>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">Provision</th><th class="txt">Category</th><th>Total consumed</th><th>Total cost ₹</th></tr></thead>
      <tbody>${provisions.map(pm=>`<tr><td class="txt">${escapeAttr(pm.name)}</td><td class="txt">${escapeAttr(pm.category)}</td><td>${fmt(consTotals[pm.id].qty,1)}</td><td>${fmtMoney(consTotals[pm.id].cost)}</td></tr>`).join('')}</tbody></table></div>`;
  return card;
}

// --- Period Average — averages EXCLUDING zero-days, so a stretch with no entries doesn't
// drag a real average down (35, 0, 45, 55 averages to 45 — the three days with activity —
// not 33.75 across all four).
async function buildPeriodAverageCard(kitchenId, fromDate, toDate){
  const bySession = {}; SESSIONS.forEach(s=>bySession[s]=[]);
  const byCategory = {}; CATEGORY_DEFS.forEach(([l,k])=>byCategory[k]=[]);
  const byAcType = {}; AC_TYPES.forEach(t=>byAcType[t]=[]);
  const overallVals = [];
  let d = fromDate, guard = 0, daysWithAnyData = 0;
  while (d <= toDate && guard < 370){
    const m = await computeDayMetrics(kitchenId, d);
    if (m.kitchenTotalStrength > 0) daysWithAnyData++;
    SESSIONS.forEach(s=>bySession[s].push(m.sessionActual[s]));
    CATEGORY_DEFS.forEach(([l,k])=>byCategory[k].push(m.categoryActual[k]));
    AC_TYPES.forEach(t=>byAcType[t].push(m.acTypeActual[t]));
    overallVals.push(m.overallPerHead);
    d = addDays(d, 1); guard++;
  }
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>Period average — ${ddmmyyyy(fromDate)} to ${ddmmyyyy(toDate)}</h2>
    <div class="note">Days with no entry are left out of each average below, not counted as ₹0 — so a gap in reporting never drags the average down.</div>
    <div class="grid4" style="margin-bottom:10px;">
      <div class="metric" style="background:#eef2ff;"><div class="lbl">Overall ₹/head</div><div class="val">${fmt(avgExcludingZero(overallVals),2)}</div></div>
      ${AC_TYPES.map(t=>`<div class="metric"><div class="lbl">${t}</div><div class="val">${fmt(avgExcludingZero(byAcType[t]),2)}</div></div>`).join('')}
    </div>
    <div class="tbl-wrap"><table><thead><tr><th class="txt">Meal / category</th><th>Average ₹/head</th><th>Days counted</th></tr></thead>
      <tbody>
        ${SESSIONS.map(s=>{ const vals=bySession[s]; const nz=vals.filter(v=>v!==0); return `<tr><td class="txt">${s[0]+s.slice(1).toLowerCase()}</td><td><b>${fmt(avgExcludingZero(vals),2)}</b></td><td>${nz.length} / ${vals.length}</td></tr>`; }).join('')}
        ${CATEGORY_DEFS.map(([label,key])=>{ const vals=byCategory[key]; const nz=vals.filter(v=>v!==0); return `<tr><td class="txt">${label}</td><td><b>${fmt(avgExcludingZero(vals),2)}</b></td><td>${nz.length} / ${vals.length}</td></tr>`; }).join('')}
      </tbody></table></div>
    <div class="note" style="margin-top:8px;">${daysWithAnyData} of ${overallVals.length} day(s) in this range have any recorded activity for this kitchen.</div>`;
  return card;
}

// ============================================================
// REPORTS — Stock-in-hand & Consumption, available to every role, scoped to what they
// can see: data-entry gets their own kitchen only (no picker needed), admin & director
// get every kitchen with a picker.
// ============================================================
async function renderReports(){
  const el = document.getElementById('view-reports');
  const myKitchens = kitchens.filter(k => myKitchenIds().includes(k.id));
  if (!currentKitchenId && myKitchens.length) currentKitchenId = myKitchens[0].id;
  if (reportFromDate === null) reportFromDate = addDays(currentDate, -6);
  if (reportToDate === null) reportToDate = currentDate;
  el.innerHTML = `
    <div class="card"><div class="row">
      ${myKitchens.length > 1 ? `<label>Kitchen</label><select id="repKitchen">${myKitchens.map(k=>`<option value="${k.id}" ${k.id===currentKitchenId?'selected':''}>${escapeAttr(k.name)}</option>`).join('')}</select>` : `<b>${myKitchens[0]?escapeAttr(myKitchens[0].name):'No kitchen'}</b>`}
      <label>Stock as of</label><input type="date" id="repStockDate" value="${currentDate}">
      <label style="margin-left:14px">Consumption: from</label><input type="date" id="repFrom2" value="${reportFromDate}">
      <label>to</label><input type="date" id="repTo2" value="${reportToDate}">
    </div></div>
    <div id="reportsBody"></div>`;
  const kSel = el.querySelector('#repKitchen');
  if (kSel) kSel.addEventListener('change', e=>{ currentKitchenId = e.target.value; renderReports(); });
  el.querySelector('#repStockDate').addEventListener('change', e=>{ currentDate = e.target.value; renderReports(); });
  el.querySelector('#repFrom2').addEventListener('change', e=>{ reportFromDate = e.target.value; renderReports(); });
  el.querySelector('#repTo2').addEventListener('change', e=>{ reportToDate = e.target.value; renderReports(); });

  if (!currentKitchenId){ document.getElementById('reportsBody').innerHTML = '<div class="card">No kitchen assigned.</div>'; return; }

  const body = document.getElementById('reportsBody');
  body.innerHTML = '<div class="note">Loading…</div>';
  const stockCard = await buildStockCard(currentKitchenId, currentDate);
  const periodCard = await buildPeriodAverageCard(currentKitchenId, reportFromDate, reportToDate);
  const consCard = await buildConsumptionCard(currentKitchenId, reportFromDate, reportToDate);
  body.innerHTML = '';
  body.appendChild(stockCard);
  body.appendChild(periodCard);
  body.appendChild(consCard);
}

initFirebase();
</script>
</body>
